# build-macos-on-tag.yml
# ---
# builds Just Notch for a release tag (`just-notch@x.y.z`) and attaches the zipped app to that tag's
# GitHub release (created by release-on-tag.yml from the same tag), versioned and as a stable `JustNotch.zip`.
#
# notch builds only inside the just-apps platform (`@just-apps/host-contract` by path), so this checks
# out just-apps and puts this repo at apps/notch. the PLATFORM_TOKEN secret is a fine-grained token
# with read access to the just-apps repo.
#
# bump-version.yml dispatches this workflow for every new tag that matches `push.tags`, passing the
# tag as the `tag` input — keep that input.
#
# code signing: the app is signed with a long-lived self-signed certificate ("Just Notch Self-Signed",
# from apps/macos/scripts/make-signing-cert.sh), base64 in the MACOS_CERT_P12 secret, its password in
# MACOS_CERT_PASSWORD. That makes the designated requirement `identifier … and certificate leaf = H"…"`,
# the same for every build, so privacy permissions (TCC) and Keychain access survive updates. Without the
# secret the build falls back to ad-hoc signing (warning), whose cdhash requirement changes every build.
# Not notarized either way: first launch needs right-click → Open, or `xattr -dr com.apple.quarantine JustNotch.app`.
#
# in-app updates (Sparkle): the zip is signed with the EdDSA private key from the SPARKLE_PRIVATE_KEY
# secret (`generate_keys -x`), and an `appcast.xml` naming this release is attached too; the app reads
# releases/latest/download/appcast.xml. Without the secret the release ships without an appcast (warning).
# CFBundleVersion is major*10000 + minor*100 + patch, so it grows with every release (Sparkle compares it).
# ---
name: build-macos-on-tag
run-name: "macOS app — ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: [ "just-notch@*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (e.g. "just-notch@0.2.0")'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # keep in step with the Sparkle package in apps/macos/project.yml
      SPARKLE_VERSION: 2.10.1
      SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
    defaults:
      run:
        working-directory: apps/notch

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/just-apps
          token: ${{ secrets.PLATFORM_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: apps/notch

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build the web runtime and plugins
        run: bun run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Version
        id: version
        run: |
          version="${TAG#just-notch@}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Signing keychain
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning title=Ad-hoc signed::the MACOS_CERT_P12 secret is missing, so this build is ad-hoc signed and users lose privacy permissions and Keychain access when they update to it"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"

      - name: Build the app
        working-directory: apps/notch/apps/macos
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          IDENTITY: Just Notch Self-Signed
        run: |
          signing=()
          if [ -n "$KEYCHAIN" ]; then
            signing=(CODE_SIGN_IDENTITY="$IDENTITY" CODE_SIGN_STYLE=Manual OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN")
          fi
          xcodegen
          xcodebuild -project JustNotch.xcodeproj -scheme JustNotch -configuration Release \
            -derivedDataPath build build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            ${signing[@]+"${signing[@]}"}
          app=build/Build/Products/Release/JustNotch.app
          # Code Sign On Copy re-signs Sparkle.framework but leaves its helpers ad-hoc; sign those too (and verify).
          if [ -n "$KEYCHAIN" ]; then scripts/sign-nested.sh "$app" "$IDENTITY" "$KEYCHAIN"; fi
          requirement="$(codesign -dr - "$app" 2>&1)"
          echo "$requirement"
          if [ -n "$KEYCHAIN" ] && ! grep -q 'designated => identifier "com.justanarthur.justnotch" and certificate leaf = H' <<< "$requirement"; then
            echo "::error title=Unstable signature::the designated requirement isn't certificate-based, so permissions wouldn't survive this update"
            exit 1
          fi

      - name: Package
        id: pkg
        run: |
          zip="JustNotch-${TAG#just-notch@}.zip"
          ditto -c -k --sequesterRsrc --keepParent apps/macos/build/Build/Products/Release/JustNotch.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Sign for Sparkle and write the appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning title=No in-app update::the SPARKLE_PRIVATE_KEY secret is missing, so this release has no appcast.xml and installed apps won't see it"
            exit 0
          fi
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$tools/sparkle.tar.xz" -C "$tools" ./bin/sign_update
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          apps/macos/scripts/appcast.sh "$tools/bin/sign_update" "$key" "${{ steps.pkg.outputs.zip }}" \
            "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}" > appcast.xml
          echo "appcast=appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the release belongs to this repo, not to the just-apps checkout around it.
          GH_REPO: ${{ github.repository }}
        run: |
          # release-on-tag.yml creates the release from the same tag, possibly after this build starts.
          for _ in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" --clobber
          # a stable name for the site's Download button: releases/latest/download/JustNotch.zip
          cp "${{ steps.pkg.outputs.zip }}" JustNotch.zip
          gh release upload "$TAG" JustNotch.zip --clobber
          # the feed the app reads: releases/latest/download/appcast.xml
          if [ -n "${{ steps.appcast.outputs.appcast }}" ]; then gh release upload "$TAG" appcast.xml --clobber; fi

      - name: Delete the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"
