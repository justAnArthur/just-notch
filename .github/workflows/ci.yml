name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Runtime tests
        run: bun run --filter @just-notch/runtime test
      - name: CLI tests
        run: bun run --filter @just-notch/cli test
      - name: Build the runtime and plugins
        run: bun run build

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the runtime and plugins
        run: bun run build
      - name: Services tests
        working-directory: apps/macos/Packages/NotchServices
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app
        working-directory: apps/macos
        run: |
          xcodegen
          xcodebuild -project JustNotch.xcodeproj -scheme JustNotch -configuration Debug -derivedDataPath build build
