name: JustNotch
options:
  bundleIdPrefix: com.justanarthur
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NotchServices:
    path: Packages/NotchServices
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  JustNotch:
    type: application
    platform: macOS
    sources:
      - path: JustNotch
    dependencies:
      - package: NotchServices
        product: NotchServices
      - package: NotchServices
        product: NotchMediaBridge
        link: false
        embed: true
    info:
      path: JustNotch/Info.plist
      properties:
        CFBundleName: Just Notch
        CFBundleDisplayName: Just Notch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: Just Notch shows your upcoming events in the notch.
        NSAppleEventsUsageDescription: Just Notch controls media playback in your music apps.
        NSBluetoothAlwaysUsageDescription: Just Notch shows your Bluetooth devices and their battery.
    entitlements:
      path: JustNotch/JustNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: JustNotch
        PRODUCT_BUNDLE_IDENTIFIER: com.justanarthur.justnotch
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postCompileScripts:
      - name: Copy web runtime and plugins
        script: '"$SRCROOT/scripts/copy-web.sh"'
        basedOnDependencyAnalysis: false
schemes:
  JustNotch:
    build:
      targets:
        JustNotch: all
    run:
      config: Debug
    archive:
      config: Release
