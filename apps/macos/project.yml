name: JustNotch
options:
  bundleIdPrefix: com.justanarthur
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NotchServices:
    path: Packages/NotchServices
  # Keep in step with SPARKLE_VERSION in .github/workflows/build-macos-on-tag.yml (sign_update).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  JustNotch:
    type: application
    platform: macOS
    sources:
      - path: JustNotch
    dependencies:
      - package: NotchServices
        product: NotchServices
      - package: NotchServices
        product: NotchMediaBridge
        link: false
        embed: true
      - package: Sparkle
    info:
      path: JustNotch/Info.plist
      properties:
        CFBundleName: Just Notch
        CFBundleDisplayName: Just Notch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "© 2026 justAnArthur. FSL-1.1-MIT."
        LSApplicationCategoryType: public.app-category.utilities
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: Just Notch shows your upcoming events in the notch.
        NSAppleEventsUsageDescription: Just Notch controls media playback in your music apps and runs the launcher’s system actions (empty the Trash, dark mode).
        NSBluetoothAlwaysUsageDescription: Just Notch shows your Bluetooth devices and their battery.
        NSLocationUsageDescription: Just Notch shows the weather where you are.
        NSLocationWhenInUseUsageDescription: Just Notch shows the weather where you are.
        NSDownloadsFolderUsageDescription: Just Notch shows your recent downloads.
        NSDesktopFolderUsageDescription: Just Notch shows your recent screenshots.
        SUFeedURL: https://github.com/justAnArthur/just-notch/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleURLTypes:
          - CFBundleURLName: com.justanarthur.justnotch
            CFBundleURLSchemes: [justnotch]
    entitlements:
      path: JustNotch/JustNotch.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        # Neither ad-hoc nor the self-signed release certificate has a Team ID, so the hardened runtime's
        # library validation refuses the embedded Sparkle.framework even when it's signed with the same
        # certificate (dyld: "different Team IDs"). A Developer ID build could drop this.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_NAME: JustNotch
        PRODUCT_BUNDLE_IDENTIFIER: com.justanarthur.justnotch
        # Local builds only; release builds pass the root package.json version (.github/workflows/build-macos-on-tag.yml).
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Sparkle's EdDSA public key (`generate_keys -p`); the private one is the SPARKLE_PRIVATE_KEY secret.
        # While this is the placeholder, Release builds fail and other builds run without updates.
        SPARKLE_PUBLIC_KEY: Xn45sRz8QJbcwXyaAomJU1WzAuSNYe+uc7l+yUdggMk=
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    preBuildScripts:
      - name: Require the Sparkle key in Release
        script: |
          if [ "$CONFIGURATION" = Release ] && [ "$SPARKLE_PUBLIC_KEY" = __SPARKLE_PUBLIC_KEY__ ]; then
            echo "error: SPARKLE_PUBLIC_KEY in apps/macos/project.yml is still the placeholder: set it to the output of Sparkle's generate_keys -p"
            exit 1
          fi
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Copy web runtime and plugins
        script: '"$SRCROOT/scripts/copy-web.sh"'
        basedOnDependencyAnalysis: false
schemes:
  JustNotch:
    build:
      targets:
        JustNotch: all
    run:
      config: Debug
    archive:
      config: Release
