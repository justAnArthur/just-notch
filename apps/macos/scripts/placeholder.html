<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Just Notch</title>
<style>
  html, body { margin: 0; background: transparent; }
  #island { position: absolute; top: 0; height: 64px; background: #000; border-radius: 0 0 20px 20px; color: #fff;
            font: 12px -apple-system; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="island">packages/runtime is not built</div>
<script>
  // Placeholder bundled when packages/runtime/dist is missing: draws the island and exercises the bridge.
  const host = (method, params = {}) => window.webkit.messageHandlers.host.postMessage({ plugin: 'runtime', method, params })
  window.__notch = { dispatch: (events) => events.forEach((e) => host('host.log', { level: 'info', message: 'event ' + e.type + ' ' + JSON.stringify(e.payload) })) }
  host('host.ready').then((info) => {
    const { notch } = info.geometry
    const island = document.getElementById('island')
    const rect = { x: notch.x - 40, y: 0, w: notch.w + 80, h: 64 }
    Object.assign(island.style, { left: rect.x + 'px', width: rect.w + 'px' })
    host('host.log', { level: 'info', message: 'placeholder ready ' + JSON.stringify(info) })
    host('window.setHitRegions', { rects: [rect] })
  }, (error) => console.error(error))
</script>
</body>
</html>
